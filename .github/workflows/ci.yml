name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.1"
  NFPM_VERSION: "2.48.0"
  NFPM_SHA256: "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK bindings and a virtual X server
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      # PyGObject comes from the distribution, so the venv must see system site-packages.
      - run: uv venv --system-site-packages --python /usr/bin/python3
      - run: uv sync --locked
      - run: xvfb-run --auto-servernum uv run pytest

  package:
    name: Build Debian package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install nfpm
        run: |
          url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location --output nfpm.tar.gz "$url"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum --check
          tar -xzf nfpm.tar.gz nfpm
          sudo install nfpm /usr/local/bin/nfpm
      - run: packaging/build-deb.sh dist
      - name: Install the package and run it
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./dist/*.deb
          live-dictate --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error
