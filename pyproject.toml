[project]
name = "live-dictate"
dynamic = ["version"]
description = "Push-to-talk dictation for Linux X11: live OpenAI transcription, LLM cleanup, pasted into the focused field."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathias Billot" }]
requires-python = ">=3.10"
keywords = ["dictation", "speech-to-text", "voice", "openai", "x11", "linux", "gtk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pynput>=1.7",
    "tomli>=2.0; python_version < '3.11'",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/spectaA/live-dictate"
Issues = "https://github.com/spectaA/live-dictate/issues"
Changelog = "https://github.com/spectaA/live-dictate/blob/main/CHANGELOG.md"

[project.scripts]
live-dictate = "live_dictate.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/live_dictate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/live_dictate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "PT", "RET", "RUF", "S", "PTH"]
ignore = [
    "S603", # subprocess calls only take fixed argument lists, never shell strings
    "S607", # system tools (parec, xdotool, xclip) are resolved through PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["gi", "gi.*", "pynput", "pynput.*", "cairo"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["live_dictate.overlay"]
# GTK classes come from PyGObject introspection and are typed as Any.
disallow_subclassing_any = false
